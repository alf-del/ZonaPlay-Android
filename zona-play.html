<script>
/*
=========================================================
 ZONA▶PLAY — PUENTE PREPARADO PARA PLAYER NATIVO
=========================================================
 Esta capa NO reemplaza el reproductor HTML actual.

 Cuando la aplicación se ejecute dentro de la versión
 Android híbrida, Android podrá exponer:

   window.ZonaPlayNativePlayer

 La misma interfaz HTML podrá entonces enviarle:
   - URL M3U8
   - URL TS
   - URL MP4
   - título
   - tipo de contenido

 Si el puente Android no existe, todo continúa usando
 el reproductor HTML actual.
=========================================================
*/

window.ZonaPlayNative = {

  available: function(){
    return !!(
      window.ZonaPlayNativePlayer &&
      typeof window.ZonaPlayNativePlayer.load === "function"
    );
  },

  load: function(url, data){
    if(!this.available() || !url) return false;

    try{
      window.ZonaPlayNativePlayer.load(
        String(url),
        JSON.stringify(data || {})
      );
      return true;
    }catch(e){
      console.error("Zona▶Play Native Bridge:", e);
      return false;
    }
  },

  play: function(){
    if(!this.available()) return;
    try{
      if(typeof window.ZonaPlayNativePlayer.play === "function"){
        window.ZonaPlayNativePlayer.play();
      }
    }catch(e){}
  },

  pause: function(){
    if(!this.available()) return;
    try{
      if(typeof window.ZonaPlayNativePlayer.pause === "function"){
        window.ZonaPlayNativePlayer.pause();
      }
    }catch(e){}
  },

  seek: function(seconds){
    if(!this.available()) return;
    try{
      if(typeof window.ZonaPlayNativePlayer.seek === "function"){
        window.ZonaPlayNativePlayer.seek(Number(seconds) || 0);
      }
    }catch(e){}
  },

  audio: function(){
    if(!this.available()) return;
    try{
      if(typeof window.ZonaPlayNativePlayer.audio === "function"){
        window.ZonaPlayNativePlayer.audio();
      }
    }catch(e){}
  },

  subtitles: function(){
    if(!this.available()) return;
    try{
      if(typeof window.ZonaPlayNativePlayer.subtitles === "function"){
        window.ZonaPlayNativePlayer.subtitles();
      }
    }catch(e){}
  },

  quality: function(){
    if(!this.available()) return;
    try{
      if(typeof window.ZonaPlayNativePlayer.quality === "function"){
        window.ZonaPlayNativePlayer.quality();
      }
    }catch(e){}
  }
};

/*
 Envía al motor nativo la URL que actualmente utiliza
 el reproductor HTML, pero solamente cuando Android
 haya instalado el puente.

 NO se modifica el comportamiento del navegador.
*/
window.zonaPlayLoadNativeIfAvailable = function(url, extraData){
  if(!window.ZonaPlayNative.available()) return false;

  return window.ZonaPlayNative.load(url, Object.assign({
    title: window.zonaPlayCurrentTitle || "",
    type: window.zonaPlayCurrentType || ""
  }, extraData || {}));
};



const video =
document.getElementById("videoPlayer");

let hls = null;

let mpegtsPlayer = null;

let controlsTimer = null;

let seekInterval = null;

document.getElementById("player-topbar");

localStorage.getItem(

) || "tv";

videoUrl =

title =

}

/* =========================================================
   TÍTULO ACTUAL
   ========================================================= */

function getCurrentContentTitle(){

if(!movieData)
return title || "";

if(movieData.type === "series"){

let base =
movieData.title || "";

let season =
movieData.season || "";

let episode =
movieData.episode || "";

let episodeTitle =
movieData.episodeTitle || "";


if(episodeTitle){

return (

base +

" · T" +

season +

"- E" +

episode +

" · " +

episodeTitle

);

}


return (

base +

" · T" +

season +

"- E" +

episode

);

}

return movieData.title || title || "";

}

function isSpanishAudioTrack(track){

if(!track)
return false;

const values = [
track.lang,
track.language,
track.languageCode,
track.name,
track.label,
track.groupId
]
.filter(Boolean)
.join(" ")
.toLowerCase();

return (
/\b(es|spa|es-[a-z]{2}|spa-[a-z]{2})\b/i.test(values) ||
values.includes("español") ||
values.includes("espanol") ||
values.includes("spanish") ||
values.includes("castellano") ||
values.includes("latino")
);
}

function selectSpanishAudioTrack(hlsInstance){

if(!hlsInstance || !Array.isArray(hlsInstance.audioTracks))
return false;

const tracks = hlsInstance.audioTracks;

const spanishIndex = tracks.findIndex(
track => isSpanishAudioTrack(track)
);

if(spanishIndex >= 0){
hlsInstance.audioTrack = spanishIndex;
return true;
}

return false;
}

function selectNativeSpanishAudioTrack(){

try{

const tracks = video.audioTracks;

if(!tracks || !tracks.length)
return false;

let found = false;

for(let i = 0; i < tracks.length; i++){

const track = tracks[i];

if(isSpanishAudioTrack(track)){
track.enabled = true;
found = true;
}else{
track.enabled = false;
}

}

return found;

}catch(e){
return false;
}
}

function selectSpanishAudio(){

let found = selectSpanishAudioTrack(hls);

if(selectNativeSpanishAudioTrack())
found = true;

return found;
}

function scheduleSpanishAudioSelection(){

selectSpanishAudio();

[100,300,700,1200,2000,3500].forEach(delay=>{

setTimeout(()=>{
selectSpanishAudio();
},delay);

});
}

function isTsUrl(url){

return /\.ts(?:$|[?#])/i.test(String(url || ""));
}

function destroyMpegtsPlayer(){

if(mpegtsPlayer){

try{
mpegtsPlayer.pause();
}catch(e){}

try{
mpegtsPlayer.unload();
}catch(e){}

try{
mpegtsPlayer.detachMediaElement();
}catch(e){}

try{
mpegtsPlayer.destroy();
}catch(e){}

mpegtsPlayer = null;
}
}

function loadTsVideo(finalUrl){

video.src = finalUrl;

video.play().catch(()=>{});
return;

function loadVideo(finalUrl){

if(!finalUrl)
return;

/* En la app Android híbrida, Media3 es el motor de reproducción.
   En navegador normal esta condición es falsa y se conserva el reproductor HTML. */
if(window.ZonaPlayNative && window.ZonaPlayNative.available && window.ZonaPlayNative.available()){
  try{
    showPlayerLoading();
    zonaPlayLoadNativeIfAvailable(finalUrl,{
      title: window.zonaPlayCurrentTitle || '',
      type: window.zonaPlayCurrentType || ''
    });
    return;
  }catch(e){
    console.error('Zona▶Play Native load:',e);
  }
}

showPlayerLoading();

try{
if(hls) hls.destroy();
}catch(e){}

hls = null;

try{
if(typeof mpegtsPlayer !== "undefined" && mpegtsPlayer){
mpegtsPlayer.destroy();
}
}catch(e){}

if(typeof mpegtsPlayer !== "undefined")
mpegtsPlayer = null;

video.pause();
video.removeAttribute("src");
video.load();

const rawUrl = String(finalUrl).trim();
const url = rawUrl.toLowerCase();

const isSpanish = (track) => {

if(!track) return false;

const value = [
track.lang,
track.language,
track.languageCode,
track.name,
track.label,
track.title,
track.groupId
].filter(Boolean).join(" ").toLowerCase();

return (
value.includes("español") ||
value.includes("espanol") ||
value.includes("spanish") ||
value.includes("castellano") ||
value.includes("latino") ||
/\b(es|spa)\b/i.test(value) ||
/\b(es|spa)-[a-z]{2}\b/i.test(value)
);

};

const selectSpanish = () => {

try{

if(
hls &&
Array.isArray(hls.audioTracks) &&
hls.audioTracks.length
){

const i =
hls.audioTracks.findIndex(isSpanish);

if(i >= 0)
hls.audioTrack = i;

}

}catch(e){}

try{

const tracks = video.audioTracks;

if(tracks && tracks.length){

let found = false;

for(let i=0;i<tracks.length;i++){

if(isSpanish(tracks[i])){

tracks[i].enabled = true;
found = true;

}else{

tracks[i].enabled = false;

}

}

return found;

}

}catch(e){}

return false;

};

const retrySpanish = () => {

selectSpanish();

[100,300,700,1200,2000,3500].forEach(ms=>{

setTimeout(selectSpanish,ms);

});

};

/* M3U8 / HLS */
if(
/\.m3u8(?:[?#].*)?$/i.test(rawUrl) ||
url.includes(".m3u8?")
){

if(Hls.isSupported()){

hls = new Hls({
enableWorker:true,
backBufferLength:0,
liveDurationInfinity:true
});

hls.loadSource(rawUrl);
hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

retrySpanish();
video.play().catch(()=>{});

});

hls.on(
Hls.Events.AUDIO_TRACKS_UPDATED,
()=>{

retrySpanish();

});

hls.on(
Hls.Events.AUDIO_TRACK_SWITCHED,
()=>{

setTimeout(selectSpanish,50);

});

hls.on(
Hls.Events.ERROR,
(event,data)=>{

if(data && data.fatal){

playerStatus.style.display = "block";

playerStatus.innerHTML =
'<i class="fas fa-circle-exclamation"></i> Error al reproducir';

}

});

}else{

video.src = rawUrl;

video.addEventListener(
"loadedmetadata",
retrySpanish,
{once:true}
);

video.load();
video.play().catch(()=>{});

}

return;

}

/* MPEG-TS */
if(
/\.ts(?:[?#].*)?$/i.test(rawUrl) ||
url.includes(".ts?")
){

if(
typeof mpegts !== "undefined" &&
mpegts.isSupported()
){

mpegtsPlayer =
mpegts.createPlayer(
{
type:"mpegts",
isLive:false,
url:rawUrl
},
{
enableWorker:true,
lazyLoad:true,
autoCleanupSourceBuffer:true
}
);

mpegtsPlayer.attachMediaElement(video);
mpegtsPlayer.load();

video.play().catch(()=>{});

}else{

video.src = rawUrl;
video.play().catch(()=>{});

}

return;

}

/* MP4 / reproducción directa */
video.src = rawUrl;

video.addEventListener(
"loadedmetadata",
retrySpanish,
{once:true}
);

video.addEventListener(
"loadeddata",
selectSpanish,
{once:true}
);

video.load();
video.play().catch(()=>{});

}

function showSeekCursor(){

seekMode = true;

seekPosition =
video.currentTime;

seekCursor.style.display =
"block";

seekTimeLabel.style.display =
"block";

movieTitleProgress.style.display =
"none";

function hideSeekCursor(){

seekMode = false;

seekCursor.style.display =
"none";

seekTimeLabel.style.display =
"none";

updateContentTitle();

}


function updateSeekCursor(){

if(!isFinite(video.duration))
return;


let percent =
(seekPosition / video.duration) * 100;


percent =
Math.max(
0,
Math.min(
100,
percent
)
);


seekCursor.style.left =
percent + "%";

seekTimeLabel.style.left =
percent + "%";

seekTimeLabel.textContent =
formatTime(seekPosition);

}


/* =========================================================
   FORMATO
   ========================================================= */

function formatTime(seconds){

if(!isFinite(seconds))
return "00:00";


seconds =
Math.max(
0,
Math.floor(seconds)
);


const hours =
Math.floor(
seconds / 3600
);


const mins =
Math.floor(
(seconds % 3600) / 60
);


const secs =
seconds % 60;


if(hours > 0){

return (

hours +
":" +
String(mins).padStart(2,"0") +
":" +
String(secs).padStart(2,"0")

);

}


return (

String(mins).padStart(2,"0") +
":" +
String(secs).padStart(2,"0")

);

}

function saveContinueWatchingProgress(){

if(!movieData)
return;


if(!isFinite(video.duration))
return;


const progress =
video.currentTime /
video.duration;


let history =
JSON.parse(
localStorage.getItem(
"continueWatching"
)
) || [];


const item = {

title: movieData.title,

poster: movieData.poster,

banner: movieData.banner,

stream: movieData.stream,

type: movieData.type || "movie",

meta: movieData.meta || "",

description:
movieData.description || "",

season:
movieData.season || 0,

episode:
movieData.episode || 0,

episodeTitle:
movieData.episodeTitle || "",

currentTime:
video.currentTime,

duration:
video.duration,

progress:
progress,

updated:
Date.now()

};


history =
history.filter(
itemHistory => {

if(item.type === "series"){

return !(
itemHistory.title ===
item.title &&

itemHistory.season ===
item.season &&

itemHistory.episode ===
item.episode
);

}

return (
itemHistory.title !==
item.title
);

}
);


history.unshift(item);

history =
history.slice(0,20);


localStorage.setItem(
"continueWatching",
JSON.stringify(history)
);

}

/* =========================================================

function playNextEpisode(){

if(
!movieData ||
movieData.type !== "series"
){

return;

}


const seriesData =
movieData.seriesData;


if(
!seriesData ||
!Array.isArray(seriesData.seasons)
){

console.log(
"No se encontró seriesData.seasons"
);

return;

}


let seasonIndex =
parseInt(
movieData.currentSeasonIndex
);


let episodeIndex =
parseInt(
movieData.currentEpisodeIndex
);


if(!isFinite(seasonIndex)){

seasonIndex = 0;

}


if(!isFinite(episodeIndex)){

episodeIndex = 0;

}


const currentSeason =
seriesData.seasons[
seasonIndex
];


if(
!currentSeason ||
!Array.isArray(
currentSeason.episodes
)
){

return;

}


/* =====================================================
   SIGUIENTE EPISODIO DE LA MISMA TEMPORADA
   ===================================================== */

const nextEpisodeIndex =
episodeIndex + 1;


if(
currentSeason.episodes[
nextEpisodeIndex
]
){

startSeriesEpisode(

seriesData,

seasonIndex,

nextEpisodeIndex

);

return;

}


/* =====================================================
   TERMINÓ LA TEMPORADA
   BUSCAR SIGUIENTE TEMPORADA
   ===================================================== */

const nextSeasonIndex =
seasonIndex + 1;


if(
seriesData.seasons[
nextSeasonIndex
]
){

const nextSeason =
seriesData.seasons[
nextSeasonIndex
];


if(
nextSeason.episodes &&
nextSeason.episodes.length > 0
){

startSeriesEpisode(

seriesData,

nextSeasonIndex,

0

);

return;

}

}


/* =====================================================
   NO HAY MÁS TEMPORADAS
   ===================================================== */

console.log(
"Serie terminada: no hay más episodios."
);

}

function startSeriesEpisode(

seasonIndex,
episodeIndex

seriesData.seasons[
seasonIndex
];


if(!season)
return;

season.episodes[
episodeIndex
];

return;


if(!episode.stream)
return;


/* =====================================================
   ACTUALIZAR movieData
   ===================================================== */

movieData.seriesData =
seriesData;

movieData.currentSeasonIndex =
seasonIndex;

movieData.currentEpisodeIndex =
episodeIndex;

movieData.season =
season.season ??
seasonIndex + 1;

movieData.episode =
episode.episode ??
episodeIndex + 1;

movieData.episodeTitle =
episode.title || "";

movieData.stream =
episode.stream;

movieData.resumeTime =
0;

movieData.progress =
0;


/* =====================================================
   TÍTULO
   ===================================================== */

title =
movieData.title || "";

videoUrl =
episode.stream;


/* =====================================================
   GUARDAR NUEVO ESTADO
   ===================================================== */

localStorage.setItem(

"zonaPlayerContent",

JSON.stringify(
movieData
)

);


/* =====================================================
   BORRAR POSICIÓN ANTERIOR
   ===================================================== */

localStorage.removeItem(
"lastPosition_" +
videoUrl
);


/* =====================================================
   ACTUALIZAR UI
   ===================================================== */

updateContentTitle();


playerImage.src =
movieData.poster ||
movieData.image ||
"";


playerImage.style.display =

(

movieData.poster ||
movieData.image

)

?

"block"

:

"none";


/*
   CORRECCIÓN:
   Antes de cargar cada episodio nuevo se muestra
   nuevamente el fondo ZONA▶PLAY + spinner.
*/

showPlayerLoading();


/* =====================================================
   CARGAR EPISODIO
   ===================================================== */

loadVideo(
episode.stream || episode.video || episode.url || episode.src || "");


showPlayerControls();

}


/* =========================================================
   RESUME
   ========================================================= */

let savedTime = 0;


if(movieData){

savedTime =
movieData.resumeTime || 0;

}else{

savedTime =
parseFloat(

localStorage.getItem(
"lastPosition_" +
videoUrl
)

) || 0;

}


if(

isMovieMode &&

savedTime > 30

){

resumeBox.style.display =
"block";

resumeBtn.focus();


resumeBtn.onclick =
()=>{

resumeBox.style.display =
"none";

video.currentTime =
savedTime;

video.play().catch(()=>{});

};


restartBtn.onclick =
()=>{

resumeBox.style.display =
"none";

video.currentTime =
0;

video.play().catch(()=>{});

};

}


/* =========================================================
   RESUME BOTONES
   ========================================================= */

let resumeIndex = 0;


const resumeButtons = [
resumeBtn,
restartBtn
];


document.addEventListener(
"keydown",
(e)=>{

if(
resumeBox.style.display !==
"block"
){

return;

}


if(
e.key === "ArrowDown"
){

resumeIndex++;

if(
resumeIndex >=
resumeButtons.length
){

resumeIndex = 0;

}

resumeButtons[
resumeIndex
].focus();

e.preventDefault();

return;

}


if(
e.key === "ArrowUp"
){

resumeIndex--;

if(
resumeIndex < 0
){

resumeIndex =
resumeButtons.length - 1;

}

resumeButtons[
resumeIndex
].focus();

e.preventDefault();

return;

}


if(
e.key === "Enter" ||
e.keyCode === 13
){

const focused =
document.activeElement;


if(
focused &&
resumeButtons.includes(
focused
)
){

focused.click();

}

e.preventDefault();

}

}
);


/* =========================================================
   NAVEGACIÓN PRINCIPAL
   ========================================================= */

document.addEventListener(
"keydown",
(e)=>{

/* =====================================================
   RESUME
   ===================================================== */

if(
resumeBox.style.display ===
"block"
){

return;

}


/* =====================================================
   MENÚ CANALES
   ===================================================== */

if(
channelSelectorMenu.classList.contains(
"active"
)
){

if(
e.key === "ArrowDown"
){

channelMenuIndex++;

if(
channelMenuIndex >=
channelButtons.length
){

channelMenuIndex = 0;

}

channelButtons[
channelMenuIndex
]?.focus();

e.preventDefault();

return;

}


if(
e.key === "ArrowUp"
){

channelMenuIndex--;

if(
channelMenuIndex < 0
){

channelMenuIndex =
channelButtons.length - 1;

}

channelButtons[
channelMenuIndex
]?.focus();

e.preventDefault();

return;

}


/*
   CORRECCIÓN:
   Flecha izquierda también cierra el selector.
*/

if(
e.key === "ArrowLeft"
){

channelSelectorMenu.classList.remove(
"active"
);

channelSelectorBtn.focus();

e.preventDefault();

return;

}


if(
e.key === "Enter" ||
e.keyCode === 13
){

const focused =
document.activeElement;


/*
   Solo ejecutar el botón actualmente enfocado.
   Esto evita que el botón selector vuelva a provocar
   una acción de cambio de canal.
*/

if(
focused &&
channelSelectorMenu.contains(
focused
)
){

focused.click();

}

e.preventDefault();

return;

}


if(
e.key === "Escape" ||
e.keyCode === 27
){

channelSelectorMenu.classList.remove(
"active"
);

channelSelectorBtn.focus();

e.preventDefault();

return;

}


/* Volver */

if(
e.key === "Backspace" ||
e.keyCode === 461
){

channelSelectorMenu.classList.remove(
"active"
);

channelSelectorBtn.focus();

e.preventDefault();

return;

}

return;

}


/* =====================================================
   ATRÁS
   ===================================================== */

if(

e.key === "Backspace" ||
e.keyCode === 461

){

video.pause();

history.back();

return;

}


/* =====================================================
   ARRIBA / ABAJO EN PELÍCULAS Y SERIES
   ===================================================== */

if(

(isMovieMode || isSeriesMode)

&&

e.key === "ArrowDown"

){

focusPlayerButton(0);

e.preventDefault();

return;

}


/* =====================================================
   TV
   ===================================================== */

if(

!isMovieMode &&
!isSeriesMode &&

playerMode === "tv" &&

channels.length > 0

){

if(
e.key === "ArrowUp"
){

changeChannel(1);

e.preventDefault();

return;

}


if(
e.key === "ArrowDown"
){

changeChannel(-1);

e.preventDefault();

return;

}

}


/* =====================================================
   24/7
   ===================================================== */

if(

!isMovieMode &&
!isSeriesMode &&

playerMode === "247" &&

channels.length > 0

){

if(
e.key === "ArrowUp"
){

change247Channel(1);

e.preventDefault();

return;

}


if(
e.key === "ArrowDown"
){

change247Channel(-1);

e.preventDefault();

return;

}

}


/* =====================================================
   SEEK
   ===================================================== */

if(
seekMode
){

if(
e.key === "ArrowDown"
){

hideSeekCursor();

clearInterval(
seekInterval
);

seekInterval = null;

focusPlayerButton(0);

e.preventDefault();

return;

}


if(
e.key === "ArrowUp"
){

e.preventDefault();

return;

}


if(
e.key === "ArrowRight" ||
e.key === "ArrowLeft"
){

seekDirection =
e.key === "ArrowRight"
?
1
:
-1;

seekPosition +=
seekDirection * 10;


seekPosition =
Math.max(
0,
seekPosition
);


if(
isFinite(video.duration)
){

seekPosition =
Math.min(
video.duration,
seekPosition
);

}


updateSeekCursor();

clearInterval(
seekInterval
);


seekInterval =
setInterval(
()=>{

seekPosition +=
seekDirection * 10;


seekPosition =
Math.max(
0,
seekPosition
);


if(
isFinite(video.duration)
){

seekPosition =
Math.min(
video.duration,
seekPosition
);

}


updateSeekCursor();

},
100
);


e.preventDefault();

return;

}


if(
e.key === "Enter" ||
e.keyCode === 13
){

clearInterval(
seekInterval
);

seekInterval = null;

video.currentTime =
seekPosition;

hideSeekCursor();

e.preventDefault();

return;

}

}


/* =====================================================
   INICIAR SEEK
   ===================================================== */

if(

(isMovieMode || isSeriesMode) &&

(
e.key === "ArrowLeft" ||
e.key === "ArrowRight"
)

){

showSeekCursor();

seekDirection =
e.key === "ArrowRight"
?
1
:
-1;

seekPosition +=
seekDirection * 10;


seekPosition =
Math.max(
0,
seekPosition
);


if(
isFinite(video.duration)
){

seekPosition =
Math.min(
video.duration,
seekPosition
);

}


updateSeekCursor();

clearInterval(
seekInterval
);


seekInterval =
setInterval(
()=>{

seekPosition +=
seekDirection * 10;


seekPosition =
Math.max(
0,
seekPosition
);


if(
isFinite(video.duration)
){

seekPosition =
Math.min(
video.duration,
seekPosition
);

}


updateSeekCursor();

},
100
);


e.preventDefault();

return;

}


/* =====================================================
   NAVEGAR BOTONES
   ===================================================== */

if(
e.key === "ArrowRight"
){

const visibleButtons =
getVisiblePlayerButtons();


playerIndex++;


if(
playerIndex >=
visibleButtons.length
){

playerIndex = 0;

}


focusPlayerButton(
playerIndex
);

e.preventDefault();

return;

}


/* =====================================================
   FLECHA IZQUIERDA
   ===================================================== */

if(
e.key === "ArrowLeft"
){

const visibleButtons =
getVisiblePlayerButtons();


playerIndex--;


if(
playerIndex < 0
){

playerIndex =
visibleButtons.length - 1;

}


focusPlayerButton(
playerIndex
);

e.preventDefault();

return;

}


/* =====================================================
   ENTER — CORRECCIÓN PRINCIPAL
   ===================================================== */

if(
e.key === "Enter" ||
e.keyCode === 13
){

const focused =
document.activeElement;


if(
focused &&
typeof focused.click ===
"function"
){

focused.click();

}


e.preventDefault();

return;

}

});


/* =========================================================
   KEYUP SEEK
   ========================================================= */

document.addEventListener(
"keyup",
(e)=>{

if(!seekMode)
return;


if(
e.key === "ArrowRight" ||
e.key === "ArrowLeft"
){

clearInterval(
seekInterval
);

seekInterval = null;

video.currentTime =
seekPosition;

hideSeekCursor();

e.preventDefault();

}

});


/* =========================================================
   ACTIVIDAD
   ========================================================= */

document.addEventListener(
"keydown",
()=>{

showPlayerControls();

}
);


document.addEventListener(
"mousemove",
()=>{

showPlayerControls();

}
);


video.addEventListener(
"play",
()=>{

showPlayerControls();

}
);


/* =========================================================
   CARGA COMPLETA
   ========================================================= */

video.addEventListener(
"loadeddata",
()=>{

selectNativeSpanishAudioTrack();

/*
   CORRECCIÓN:
   Aquí se mantiene la lógica original:
   cuando el video ya tiene datos suficientes,
   se oculta el logo de fondo y el spinner.
*/

hidePlayerBackground();

playerStatus.style.display =
"none";


let resume = 0;


if(movieData){

resume =
movieData.resumeTime || 0;

}else{

resume =
parseFloat(

localStorage.getItem(
"lastPosition_" +
videoUrl
)

) || 0;

}


if(
resume > 0 &&
isFinite(video.duration)
){

try{

video.currentTime =
resume;

}catch(e){}

}


if(
isMovieMode &&
isFinite(video.duration)
){

localStorage.setItem(

"duration_" +
videoUrl,

video.duration

);

}

}
);


/* =========================================================
   WAITING
   ========================================================= */

video.addEventListener(
"waiting",
()=>{

if(
!isMovieMode &&
!isSeriesMode
){

durationTimeText.innerHTML =
'<span class="live-off">●</span> EN VIVO';

}


/*
   Si el video entra en buffering, mantenemos el
   spinner y el fondo visible hasta que vuelva a
   reproducirse.
*/

showPlayerLoading();

}
);


/* =========================================================
   ERROR
   ========================================================= */

video.addEventListener(
"error",
()=>{

playerStatus.style.display =
"block";

playerStatus.innerHTML =
'<i class="fas fa-circle-exclamation"></i> Error al reproducir';

}
);


/* =========================================================
   VIDEO TERMINADO
   ========================================================= */

video.addEventListener(
"ended",
()=>{

if(!movieData)
return;


/* Eliminar episodio terminado */

removeCurrentEpisodeFromHistory();


/* =====================================================
   SERIE
   ===================================================== */

if(
movieData.type === "series"
){

playNextEpisode();

return;

}


/* =====================================================
   PELÍCULA
   ===================================================== */

localStorage.removeItem(
"lastPosition_" +
videoUrl
);

}
);


/* =========================================================
   CONFIGURAR UI
   ========================================================= */

configureContentUI();

updateContentTitle();

showChannelInfo();

showPlayerControls();

focusPlayerButton(0);


/* =========================================================
   TÍTULO INICIAL
   ========================================================= */

if(
isMovieMode ||
isSeriesMode
){

updateContentTitle();

}else{

showChannelInfo();

}

</script>

<script>
/* Estado público para el futuro puente Android */
(function(){
  window.zonaPlayCurrentTitle = window.zonaPlayCurrentTitle || "";
  window.zonaPlayCurrentType = window.zonaPlayCurrentType || "";

  function syncZonaPlayNativeState(){
    try{
      if(typeof title !== "undefined"){
        window.zonaPlayCurrentTitle = title || "";
      }
      if(typeof movieData !== "undefined" && movieData){
        window.zonaPlayCurrentType = movieData.type || "";
      }
    }catch(e){}
  }

  window.addEventListener("zonaPlaySyncNativeState", syncZonaPlayNativeState);
})();
</script>

</body>
</html>
